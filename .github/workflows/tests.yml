name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
        db:
          - { name: mysql, image: "mysql:8.0", healthcmd: "mysqladmin ping -h localhost -uroot -proot" }
          - { name: mariadb, image: "mariadb:11", healthcmd: "mariadb-admin ping -h localhost -uroot -proot" }

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: loxodontu_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.healthcmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent && break
            sleep 2
          done

      - name: Configure environment
        run: |
          echo "ENV=testing" >> .env
          echo "DB_MODE=testing" >> .env
          echo "DB_HOST_TEST=127.0.0.1" >> .env
          echo "DB_PORT_TEST=3306" >> .env
          echo "DB_USERNAME_TEST=root" >> .env
          echo "DB_PASSWORD_TEST=root" >> .env
          echo "DB_DATABASE_TEST=loxodontu_test" >> .env

      - name: Run test suite with coverage
        run: composer test:coverage
